set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"

# Theme selection follows the inherited LIGHT_SWITCH env var (set in
# ~/.zprofile). 1 (default) -> light, 0 -> dark. To swap dark to a
# different theme system entirely (e.g. dracula tmux), replace the body of
# the %if (dark) branch with that plugin's setup + run line.
%if "#{==:#{LIGHT_SWITCH},0}"
  # --- dark ---
  set -g @catppuccin_flavor "mocha"
  set -g @catppuccin_window_status_style "basic"
  run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux
%else
  # --- light ---
  set -g @catppuccin_flavor "latte"
  set -g @catppuccin_window_status_style "basic"
  run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux
%endif

# Options to make tmux more pleasant
set -g mouse on
set -g default-terminal "tmux-256color"
set -g status-interval 1

# Make the status line pretty and add some modules
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -agF status-right "#{E:@catppuccin_status_ram}"

run ~/.config/tmux/plugins/tmux-cpu/cpu.tmux

source-file ~/.config/tmux/keybinds.conf
