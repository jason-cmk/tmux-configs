bind h split-window -h
bind v split-window -v
bind a attach-session -c "#{pane_current_path}"

# Vertical fuzzy window switcher in a popup (prefix + w)
bind w display-popup -E -w 80% -h 60% \
  "tmux list-windows -F '#I: #W#{?window_active, *,}' \
   | fzf --reverse --header='switch window' --delimiter=':' \
         --preview 'tmux capture-pane -ep -t {1}' \
         --preview-window=right:70% \
   | cut -d: -f1 | xargs -r tmux select-window -t"
