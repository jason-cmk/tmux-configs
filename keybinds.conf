bind h split-window -h
bind v split-window -v
bind a attach-session -c "#{pane_current_path}"

# Toggle a vertical window list on the left of the current window (prefix + p)
bind p run-shell '~/.config/tmux/sidebar.sh toggle "#{window_id}"'

# Live window switcher with the preview following the latest output (prefix + w)
unbind W
bind w display-popup -E -w 80% -h 60% ~/.config/tmux/window-picker.sh
